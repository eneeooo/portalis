name: Deploy Portalis Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs: deploy-pages looks the artifact up through the GitHub API,
  # and doing that in the same job, a split second after the upload, can come back empty.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build song list from the song folder
        run: ls Portalis/song | grep -iE '\.(mp3|m4a|ogg|wav)$' | jq -R . | jq -s . > Portalis/song/songs.json

      - name: Upload Portalis folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Portalis

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4