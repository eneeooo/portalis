name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project ref is public (it is the first part of SUPABASE_URL in config.js).
      # A SUPABASE_PROJECT_REF secret overrides it if you ever switch projects.
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'wtvdcmlwaihcllpghikd' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check access token
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the SUPABASE_ACCESS_TOKEN secret: repo Settings > Secrets and variables > Actions"; exit 1; }
      - name: Deploy username-login
        run: supabase functions deploy username-login --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy auth-email-update
        run: supabase functions deploy auth-email-update --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy admin-delete-user
        run: supabase functions deploy admin-delete-user --project-ref "$PROJECT_REF" --no-verify-jwt
