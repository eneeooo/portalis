name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets exist
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$PROJECT_REF" || { echo "Missing secret SUPABASE_PROJECT_REF"; exit 1; }
      - name: Deploy student-auth
        run: supabase functions deploy student-auth --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy admin-delete-user
        run: supabase functions deploy admin-delete-user --project-ref "$PROJECT_REF" --no-verify-jwt
