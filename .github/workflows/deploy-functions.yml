name: Deploy Supabase Edge Functions

# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  = a personal access token from
#                            https://supabase.com/dashboard/account/tokens
# The project ref below is the one in Portalis/config.js.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

env:
  PROJECT_REF: wtvdcmlwaihcllpghikd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions (verify_jwt is set to false in supabase/config.toml)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROJECT_REF }}
        run: |
          supabase functions deploy username-login --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy auth-email-update --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-delete-user --project-ref "$PROJECT_REF" --no-verify-jwt
