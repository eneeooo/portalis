<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portalis - Confessions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div id="bar"></div>
    <h2>Anonymous confessions</h2>
    <p class="hint">Posts are anonymous to All. Please keep posts respectful.</p>
    <div class="card">
      <label for="content">Your confession</label>
      <textarea id="content" maxlength="1500" placeholder="Share something with the class..."></textarea>
      <label for="feeling">How are you feeling?</label>
      <select id="feeling">
        <option value="in-love">In love</option>
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="anxious">Anxious</option>
        <option value="grateful">Grateful</option>
        <option value="hopeful">Hopeful</option>
        <option value="other" selected>Other</option>
      </select>
      <button id="post">Post anonymously</button>
      <p id="msg" class="msg"></p>
    </div>
    <div id="feed" class="confession-feed"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    let ctx;
    const $ = id => document.getElementById(id);
    async function init() {
      ctx = await requireAuth(); if (!ctx) return;
      renderBar(ctx, "confessions");
      await load();
    }
    async function load() {
      const { data, error } = await sb.from("confessions").select("id,content,feeling,created_at").order("created_at", { ascending: false });
      if (error) { $("msg").className = "msg err"; $("msg").textContent = error.message; return; }
      const feed = $("feed"); feed.innerHTML = "";
      if (!data.length) feed.appendChild(el("p", "empty", "No confessions yet."));
      data.forEach(item => {
        const isLong = String(item.content || "").length > 220;
        const card = el("article", "note confession-note" + (isLong ? " is-folded" : "") + " feeling-" + (item.feeling || "other"));
        card.appendChild(el("span", "feeling-label", feelingLabel(item.feeling)));
        if (isLong) {
          card.appendChild(el("p", "confession confession-preview", foldedPreview(item.content)));
          const foldTip = el("button", "confession-fold-tip", "");
          foldTip.type = "button";
          foldTip.setAttribute("aria-label", "Open the full confession note");
          foldTip.onclick = () => openConfession(item);
          card.appendChild(foldTip);
        } else {
          card.appendChild(el("p", "confession", item.content));
        }
        card.appendChild(el("small", "", fmtDate(item.created_at)));
        if (ctx.role === "admin") {
          const remove = el("button", "ghost small", "Delete");
          remove.onclick = async () => {
            if (!confirm("Delete this confession?")) return;
            const { error } = await sb.from("confessions").delete().eq("id", item.id);
            if (error) { $("msg").className = "msg err"; $("msg").textContent = error.message; }
            else load();
          };
          card.appendChild(remove);
        }
        feed.appendChild(card);
      });
    }
    function foldedPreview(content) {
      const text = String(content || "").trim();
      if (text.length <= 220) return text;
      const clipped = text.slice(0, 220);
      const lastSpace = clipped.lastIndexOf(" ");
      return (lastSpace > 160 ? clipped.slice(0, lastSpace) : clipped).trim() + "...";
    }
    function openConfession(item) {
      const dialog = el("div", "modal-backdrop confession-modal-backdrop");
      const card = el("article", "modal-card note confession-modal-note feeling-" + (item.feeling || "other"));
      card.setAttribute("role", "dialog");
      card.setAttribute("aria-modal", "true");
      card.setAttribute("aria-label", "Confession note");
      card.append(
        el("span", "feeling-label", feelingLabel(item.feeling)),
        el("p", "confession confession-modal-copy", item.content),
        el("small", "confession-modal-date", fmtDate(item.created_at))
      );
      const actions = el("div", "confession-modal-actions");
      if (ctx.role === "admin") {
        const remove = el("button", "danger small", "Delete");
        remove.type = "button";
        remove.onclick = async () => {
          if (!confirm("Delete this confession?")) return;
          const { error } = await sb.from("confessions").delete().eq("id", item.id);
          if (error) { $("msg").className = "msg err"; $("msg").textContent = error.message; return; }
          close();
          await load();
        };
        actions.appendChild(remove);
      }
      const closeButton = el("button", "ghost", "Close");
      closeButton.type = "button";
      actions.appendChild(closeButton);
      card.appendChild(actions);
      dialog.appendChild(card);

      const close = () => {
        dialog.remove();
        document.removeEventListener("keydown", onKey);
      };
      const onKey = event => { if (event.key === "Escape") close(); };
      closeButton.onclick = close;
      dialog.onclick = event => { if (event.target === dialog) close(); };
      document.addEventListener("keydown", onKey);
      document.body.appendChild(dialog);
      closeButton.focus();
    }
    function feelingLabel(feeling) {
      const labels = {
        "in-love": "In love", happy: "Happy", sad: "Sad",
        anxious: "Anxious", grateful: "Grateful", hopeful: "Hopeful", other: "Other"
      };
      return labels[feeling] || labels.other;
    }
    $("post").onclick = async () => {
      const content = $("content").value.trim();
      if (!content) { $("msg").className = "msg err"; $("msg").textContent = "Write a confession first."; return; }
      const { error } = await sb.from("confessions").insert({ content, feeling: $("feeling").value });
      if (error) { $("msg").className = "msg err"; $("msg").textContent = error.message; return; }
      $("content").value = ""; $("msg").className = "msg ok"; $("msg").textContent = "Posted anonymously.";
      await load();
    };
    init();
  </script>
</body>
</html>
