<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portalis - Sign up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth">
      <h1>Portalis</h1>
      <p class="sub">Create your class account.</p>
      <div class="note">
        <h2>Sign up</h2>
        <label for="studentNumber">Student number</label>
        <input id="studentNumber" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="00-00-000" />
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" />
        <label for="fullName">Full name</label>
        <input id="fullName" autocomplete="name" maxlength="100" placeholder="First and last name" />
        <label for="birthDate">Birthdate</label>
        <input id="birthDate" type="date" autocomplete="bday" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
        <label for="password2">Confirm password</label>
        <input id="password2" type="password" autocomplete="new-password" placeholder="Type it again" />
        <button id="signup" class="full">Create account</button>
        <p id="msg" class="msg"></p>
        <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script>
      const msg = document.getElementById("msg");
      const btn = document.getElementById("signup");
      function show(text, isErr) { msg.className = "msg" + (isErr ? " err" : ""); msg.textContent = text; }
      document.getElementById("studentNumber").addEventListener("input", e => {
        const digits = e.target.value.replace(/\D/g, "").slice(0, 7);
        e.target.value = digits.length > 4 ? digits.slice(0, 2) + "-" + digits.slice(2, 4) + "-" + digits.slice(4)
          : digits.length > 2 ? digits.slice(0, 2) + "-" + digits.slice(2) : digits;
      });
      btn.onclick = async () => {
        show("", false);
        const student_number = document.getElementById("studentNumber").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const full_name = document.getElementById("fullName").value.trim();
        const birth_date = document.getElementById("birthDate").value;
        const password = document.getElementById("password").value;
        const password2 = document.getElementById("password2").value;
        if (!student_number || !email || !full_name || !birth_date || !password) return show("Enter your student number, email, full name, birthdate, and password.", true);
        if (!/^\d{2}-\d{2}-\d{3}$/.test(student_number)) return show("Student number must use the format 00-00-000.", true);
        if (!document.getElementById("email").validity.valid || email.endsWith(".invalid")) return show("Enter a valid email address.", true);
        const todayParts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Manila", year: "numeric", month: "2-digit", day: "2-digit"
        }).formatToParts(new Date());
        const todayPart = type => todayParts.find(part => part.type === type).value;
        const manilaToday = todayPart("year") + "-" + todayPart("month") + "-" + todayPart("day");
        if (birth_date > manilaToday) return show("Birthdate cannot be in the future.", true);
        if (password.length < 6) return show("Password must be at least 6 characters.", true);
        if (password !== password2) return show("Passwords do not match.", true);
        btn.disabled = true;
        try {
          const { data: isClassMember, error: membershipError } = await sb.rpc("student_number_is_class_12", { p_student_number: student_number });
          if (membershipError) throw membershipError;
          if (!isClassMember) {
            show("Only students listed in the class 12 roster can sign up.", true); return;
          }
          const { data: numberTaken, error: numberError } = await sb.rpc("student_number_is_taken", { p_student_number: student_number });
          if (numberError) throw numberError;
          if (numberTaken) {
            show("That student number is already registered.", true); return;
          }
          const { data, error } = await sb.auth.signUp({
            email, password,
            options: { data: { student_number, full_name, birth_date } }
          });
          if (error) throw error;
          if (data.session) { location.href = "dashboard.html"; return; }
          const returnedStudentNumber = data.user && data.user.user_metadata && data.user.user_metadata.student_number;
          const returnedEmail = data.user && data.user.email;
          show("Account created for " + (returnedStudentNumber || student_number) + " (" + (returnedEmail || email) + "). Check your email for the confirmation link before signing in.", false);
        } catch (error) {
          const message = error.message || "Could not create the account.";
          if (/rate limit|email.*limit/i.test(message)) {
            show("Supabase has temporarily limited signup or confirmation emails. Wait a few minutes before trying again, or configure custom SMTP in Supabase.", true);
          } else {
            show(/duplicate|unique|already exists|already registered/i.test(message) ? "That email address or student number is already registered." : message, true);
          }
        } finally { btn.disabled = false; }
      };
    </script>
  </body>
</html>
