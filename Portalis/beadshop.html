<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Unique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="beadbox.css" />
</head>
<body>

  <!-- first page -->
  <div id="intro">
    <div class="awning"></div>
    <div class="intro-body">
      <div class="booth sticker">
        <span class="star s1">★</span>
        <span class="star s2">★</span>
        <div class="window">
          <div class="logo">Unique <b>anik</b></div>
          <p>Beads, keychains &amp; more!</p>
          <p class="ready">READY!</p>
        </div>
        <div class="actions">
          <button id="introFull" class="btn yellow big">⛶ Go Full Screen</button>
          <button id="introSkip" class="btn white">Open shop without full screen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- shop (customer view) -->
  <div id="app" hidden>
    <div class="sparkles" aria-hidden="true"><span>★</span><span>♥</span><span>★</span><span>●</span><span>★</span><span>♥</span><span>★</span><span>●</span></div>
    <div class="awning"></div>
    <div id="topbar" class="topbar">
      <img class="brand-logo" src="unique-logo.png" alt="Unique" />
      <div class="logo">anik <b>anik</b> <span class="star">★</span></div>
      <div class="spacer"></div>
      <button id="fsBtn" class="btn white">⛶ Full Screen</button>
    </div>

    <main>
      <section class="shop">
        <h2>Tap what you want</h2>
        <div id="grid" class="grid"></div>
      </section>
    </main>
  </div>

  <button id="openCart" class="btn yellow big" hidden>🛒 Checkout</button>

  <!-- checkout box: only opens when the customer taps the Checkout button -->
  <div id="cartPanel" hidden>
    <div class="cart sticker">
      <div class="cart-head">
        <h2>Your cart</h2>
        <button id="closeCart" class="btn white" type="button">✕ Close</button>
      </div>
      <div id="cartLines"></div>
      <div class="totalrow"><span>Total</span><span id="cartTotal">₱0</span></div>
      <label for="customer">Your name</label>
      <input id="customer" class="field" placeholder="Optional" autocomplete="off" maxlength="60" />
      <button id="checkoutBtn" class="btn yellow big" disabled>Place order</button>
      <button id="clearCart" class="btn white">Clear cart</button>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="beadbox.js"></script>
  <script>
    let products = [];
    const cart = {};            // variant key -> quantity ("5" for normal products, "5|Small" for sizes)
    let tapped = null;          // product just tapped, so its card can bounce

    /* ---------- pricing ---------- */
    // every way a product can be bought: one entry normally, one per size for sized products
    function variants(p) {
      return p.sizes
        ? p.sizes.map(s => ({ key: p.id + "|" + s.label, label: s.label, price: s.price }))
        : [{ key: String(p.id), label: null, price: p.price }];
    }
    function priceLine(p, qty, price) {
      const free = p.buy5get1 ? Math.floor(qty / FREE_EVERY) : 0;
      const total = p.bundle5 !== null
        ? Math.floor(qty / FREE_EVERY) * p.bundle5 + (qty % FREE_EVERY) * price
        : qty * price;
      return { free, total };
    }
    function cartItems() {
      return products.flatMap(p => variants(p).filter(v => cart[v.key] > 0).map(v => {
        const qty = cart[v.key];
        const { free, total } = priceLine(p, qty, v.price);
        return { key: v.key, name: v.label ? p.name + " (" + v.label + ")" : p.name, price: v.price, qty, free, total };
      }));
    }
    function addToCart(p, key) {
      tapped = p.id;
      cart[key] = (cart[key] || 0) + 1;
      renderShop();
      renderCart();
    }
    function pickSize(p) {
      const m = $("modal");
      m.replaceChildren();
      const box = el("div", "modal-box");
      box.append(el("h3", "", p.name + " · pick a size"));
      variants(p).forEach(v => {
        const b = el("button", "btn yellow big", v.label + " · " + peso(v.price));
        b.type = "button";
        b.style.width = "100%";
        b.style.marginTop = "10px";
        b.onclick = () => { m.hidden = true; addToCart(p, v.key); };
        box.append(b);
      });
      const cancel = el("button", "btn white", "Cancel"); cancel.type = "button";
      cancel.style.width = "100%";
      cancel.style.marginTop = "10px";
      cancel.onclick = () => { m.hidden = true; };
      box.append(cancel);
      m.append(box);
      m.hidden = false;
    }

    /* ---------- full screen ---------- */
    async function toggleFullscreen() {
      if (!document.documentElement.requestFullscreen) {
        throw new Error("This browser has no full screen mode. On iPhone: Share → Add to Home Screen.");
      }
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    }
    document.addEventListener("fullscreenchange", () => {
      const on = !!document.fullscreenElement;
      document.body.classList.toggle("is-fs", on);
      $("fsBtn").classList.remove("show");
      $("fsBtn").textContent = on ? "✕ Exit Full Screen" : "⛶ Full Screen";
    });

    // In full screen the button is faded. Hover shows it (mouse); a tap on the top bar shows it for 3 seconds (touch).
    // The tap that reveals the button must not also exit full screen, hence fsWasVisible.
    let fsRevealTimer;
    let fsWasVisible = true;
    $("topbar").addEventListener("pointerdown", e => {
      const btn = $("fsBtn");
      const fs = !!document.fullscreenElement;
      fsWasVisible = !fs || e.pointerType === "mouse" || btn.classList.contains("show");
      if (!fs) return;
      btn.classList.add("show");
      clearTimeout(fsRevealTimer);
      fsRevealTimer = setTimeout(() => btn.classList.remove("show"), 3000);
    });
    $("fsBtn").onclick = () => {
      const visible = fsWasVisible;
      fsWasVisible = true;
      if (visible) run(toggleFullscreen);
    };

    function enterApp() { $("intro").hidden = true; $("app").hidden = false; }
    $("introFull").onclick = () => run(async () => { await toggleFullscreen(); enterApp(); });
    $("introSkip").onclick = enterApp;

    /* ---------- products ---------- */
    async function loadProducts() {
      products = must(await sb.from("bead_products").select("*").order("id"));
      renderShop();
      renderCart();
    }
    sb.channel("bead-products")
      .on("postgres_changes", { event: "*", schema: "public", table: "bead_products" }, () => run(loadProducts))
      .subscribe(status => {
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") toast("Live product updates are off. Reload the page.");
      });
    run(loadProducts);

    function renderShop() {
      const grid = $("grid");
      grid.replaceChildren();
      if (!products.length) {
        const empty = el("div", "empty");
        empty.append(mascot(), el("div", "", "Shelves are being stocked! Come back soon ✨"));
        grid.append(empty);
      }
      products.forEach((p, i) => {
        const b = el("button", "prod c" + (i % 6) + (p.image ? " has-photo" : "") + (p.id === tapped ? " bounce" : ""));
        b.type = "button";
        // With a photo the card itself is see-through; the text sits in a small label under the picture.
        let box = b;
        if (p.image) {
          const pic = el("img", "pic");
          pic.src = p.image;
          pic.alt = "";
          b.append(pic);
          box = el("div", "label");
          b.append(box);
        }
        box.append(el("div", "name", p.name));
        const info = el("div");
        if (p.sizes) {
          info.append(el("div", "price", "from " + peso(p.price)));
          p.sizes.forEach(s => info.append(el("span", "tag", s.label + " " + peso(s.price))));
        } else {
          info.append(el("div", "price", peso(p.price)));
        }
        if (p.bundle5 !== null) info.append(el("span", "tag", "5 for " + peso(p.bundle5)));
        if (p.buy5get1) info.append(el("span", "tag gift", "🎁 Buy 5 Get 1!"));
        box.append(info);
        const inCart = variants(p).reduce((s, v) => s + (cart[v.key] || 0), 0);
        if (inCart > 0) b.append(el("div", "count", String(inCart)));
        b.onclick = () => p.sizes ? pickSize(p) : addToCart(p, String(p.id));
        grid.append(b);
      });
      tapped = null;
    }

    function renderCart() {
      const box = $("cartLines");
      box.replaceChildren();
      const items = cartItems();
      if (!items.length) box.append(el("div", "cart-empty", "Your cart is empty. Pick something pretty! 🎀"));
      items.forEach(it => {
        const line = el("div", "line");
        line.append(el("div", "n", it.name + " · " + peso(it.price)));
        line.append(el("div", "t", peso(it.total)));
        const q = el("div", "qty");
        const minus = el("button", "", "−"); minus.type = "button";
        const plus = el("button", "", "+"); plus.type = "button";
        minus.onclick = () => { cart[it.key] -= 1; renderShop(); renderCart(); };
        plus.onclick = () => { cart[it.key] += 1; renderShop(); renderCart(); };
        q.append(minus, el("span", "", String(it.qty)), plus);
        line.append(q);
        if (it.free > 0) line.append(el("div", "free-tag", "🎁 +" + it.free + " FREE " + it.name));
        box.append(line);
      });
      const total = items.reduce((s, it) => s + it.total, 0);
      const count = items.reduce((s, it) => s + it.qty, 0);
      $("cartTotal").textContent = peso(total);
      $("checkoutBtn").disabled = !items.length;
      $("openCart").hidden = count === 0;
      $("openCart").textContent = "🛒 Checkout · " + count + (count === 1 ? " item" : " items") + " · " + peso(total);
      if (count === 0) $("cartPanel").hidden = true;
    }

    $("openCart").onclick = () => { $("cartPanel").hidden = false; };
    $("closeCart").onclick = () => { $("cartPanel").hidden = true; };
    $("cartPanel").onclick = e => { if (e.target === $("cartPanel")) $("cartPanel").hidden = true; };

    function emptyCart() { Object.keys(cart).forEach(k => delete cart[k]); }
    $("clearCart").onclick = () => { emptyCart(); renderShop(); renderCart(); };

    /* ---------- checkout ---------- */
    function confetti() {
      const layer = el("div", "confetti");
      const shapes = ["★", "♥", "●"];
      const colors = ["#ffd83d", "#f7a3cb", "#2447e8", "#e0343f", "#7fd6b4"];
      for (let i = 0; i < 36; i++) {
        const bit = el("span", "", shapes[i % shapes.length]);
        bit.style.left = Math.random() * 100 + "vw";
        bit.style.color = colors[i % colors.length];
        bit.style.fontSize = 14 + Math.random() * 16 + "px";
        bit.style.animationDelay = Math.random() * 0.6 + "s";
        layer.append(bit);
      }
      document.body.append(layer);
      setTimeout(() => layer.remove(), 3500);
    }

    function showReceipt(order) {
      const m = $("modal");
      m.replaceChildren();
      const box = el("div", "modal-box");
      box.append(buildReceipt(order));
      box.append(el("p", "sent", "Thank you! Your order is being made ♡"));
      const done = el("button", "btn yellow big", "Done"); done.type = "button";
      done.style.width = "100%";
      done.onclick = () => { m.hidden = true; };
      box.append(done);
      m.append(box);
      m.hidden = false;
      confetti();
    }

    $("checkoutBtn").onclick = () => run(async () => {
      const items = cartItems().map(({ key, ...item }) => item);
      const total = items.reduce((s, it) => s + it.total, 0);
      const customer = $("customer").value.trim();
      $("checkoutBtn").disabled = true;
      try {
        const order = must(await sb.from("bead_orders").insert({ customer, items, total }).select().single());
        emptyCart();
        $("customer").value = "";
        showReceipt(order);
      } finally {
        renderShop();
        renderCart();
      }
    });
  </script>
</body>
</html>
