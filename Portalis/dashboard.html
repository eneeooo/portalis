<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portalis - Notes</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="birthday-card.css?v=2" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
  </head>
  <body>
    <div class="wrap">
      <div id="bar"></div>

      <div class="tabs notes-tabs">
        <button id="tabBoard" class="tab on">Public board</button>
        <button id="tabMine" class="tab">My notes</button>
      </div>
      <p id="msg" class="msg"></p>

      <!-- New note (My notes tab only). The paper takes the colour of the importance you pick. -->
      <div id="composer" class="note composer p-medium" style="display: none">
        <div class="composer-head">
          <h2>✍️ New note</h2>
          <p class="hint" id="postHint"></p>
        </div>

        <label for="title">Title</label>
        <div class="field-wrap">
          <input id="title" placeholder="e.g. Bring valid ID tomorrow" maxlength="80" autocomplete="off" />
          <span class="field-count" id="titleCount">0/80</span>
        </div>

        <span class="composer-label" id="importanceLabel">How important is it?</span>
        <div id="importancePicker" class="prio-pick" role="radiogroup" aria-labelledby="importanceLabel">
          <label class="p-low"><input type="radio" name="prio" value="low" /><span>🌱 Low</span></label>
          <label class="p-neutral"><input type="radio" name="prio" value="neutral" /><span>💬 Neutral</span></label>
          <label class="p-medium"><input type="radio" name="prio" value="medium" checked /><span>📌 Medium</span></label>
          <label class="p-high"><input type="radio" name="prio" value="high" /><span>⚡ High</span></label>
          <label class="p-urgent"><input type="radio" name="prio" value="urgent" /><span>🔥 Urgent</span></label>
        </div>

        <div class="composer-detail-head">
          <label for="content">Details <small>(optional)</small></label>
          <div class="fmt-pick" role="radiogroup" aria-label="Format">
            <label><input type="radio" name="fmt" value="text" checked /><span>Plain</span></label>
            <label><input type="radio" name="fmt" value="bullets" /><span>&bull; Bullets</span></label>
            <label><input type="radio" name="fmt" value="numbered" /><span>1. Numbered</span></label>
          </div>
        </div>
        <textarea id="content" placeholder="Write something..."></textarea>
        <p id="fmtHint" class="hint"></p>

        <label for="subInput">Checklist <small>(optional)</small></label>
        <div class="subrow">
          <input id="subInput" placeholder="Add an item, press Enter" autocomplete="off" />
          <button id="subAdd" type="button" aria-label="Add checklist item">+</button>
        </div>
        <ul id="pending" class="chips"></ul>

        <button id="add" class="full">📌 Post note</button>
      </div>

      <div id="birthdayGreeting" class="birthday-pin" hidden></div>
      <section id="eventsStrip" class="ev-strip" hidden aria-label="Upcoming school events"></section>
      <div id="filters" class="filters"></div>
      <div id="board" class="board"></div>
      <p id="empty" class="empty" style="display: none"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="birthday-card.js?v=2"></script>
    <script src="calendar.js?v=1"></script>
    <script>
      let ctx,
        view = "board",
        notes = [],
        filter = "all",
        pending = [],
        counts = {},
        birthdayDate = "",
        birthdayColorIndex = -1;
      const msg = document.getElementById("msg");

      function err(t) {
        msg.className = "msg err";
        msg.textContent = t;
      }
      function ok(t) {
        msg.className = "msg ok";
        msg.textContent = t;
      }
      function clearMsg() {
        msg.className = "msg";
        msg.textContent = "";
      }

      async function init() {
        ctx = await requireAuth();
        if (!ctx) return;
        renderBar(ctx, "notes");
        if (window.PortalisCalendar) {
          PortalisCalendar.renderUpcoming(document.getElementById("eventsStrip"), { canEdit: !!ctx.isAdmin, limit: 6 });
        }
        document.getElementById("postHint").textContent = ctx.isAdmin
          ? "Admin and officer notes are posted right away."
          : "Your note is sent to an admin or officer first. It shows on the public board once approved.";
        document.getElementById("importanceLabel").style.display = ctx.isAdmin
          ? "block"
          : "none";
        document.getElementById("importancePicker").style.display = ctx.isAdmin
          ? "flex"
          : "none";
        setView("board");
        birthdayDate = manilaDateKey();
        window.setInterval(() => {
          const today = manilaDateKey();
          if (today !== birthdayDate) {
            birthdayDate = today;
            if (view === "board") loadBirthdayGreeting();
          }
        }, 30000);
      }

      function manilaDateKey() {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Manila",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date());
        const part = (type) => parts.find((item) => item.type === type).value;
        return part("year") + "-" + part("month") + "-" + part("day");
      }

      async function loadBirthdayGreeting() {
        const pin = document.getElementById("birthdayGreeting");
        if (view !== "board") {
          pin.hidden = true;
          return;
        }
        const { data, error } = await sb.rpc("birthdays_today_with_wishes");
        if (view !== "board") {
          pin.hidden = true;
          return;
        }
        if (error) {
          err(error.message);
          pin.hidden = true;
          return;
        }
        if (!data || !data.length) {
          pin.hidden = true;
          return;
        }
        let wishTitles;
        try {
          wishTitles = await loadStaffAuthorTitles(data.map((row) => row.author_id));
        } catch (titleError) {
          err(titleError.message);
          pin.hidden = true;
          return;
        }
        const photos = {};
        const settings = {};
        try {
          const ids = Array.from(new Set(data.map((row) => row.recipient_id)));
          const { data: photoRows } = await sb
            .from("birthday_photos")
            .select("recipient_id,image_path")
            .in("recipient_id", ids);
          (photoRows || []).forEach((row) => {
            photos[row.recipient_id] = row.image_path;
          });
          const { data: settingRows } = await sb
            .from("birthday_settings")
            .select("recipient_id,song,style")
            .in("recipient_id", ids);
          (settingRows || []).forEach((row) => {
            settings[row.recipient_id] = row;
          });
        } catch (_) {}
        PortalisBirthday.stopAll();
        pin.replaceChildren();
        pin.className = "bday-pin";
        ["🎈", "🎉", "🎊", "🎂", "✨", "🎈"].forEach((symbol) => {
          const floater = el("span", "bday-float", symbol);
          floater.setAttribute("aria-hidden", "true");
          pin.appendChild(floater);
        });
        pin.appendChild(el("strong", "bday-title", "🎂 Birthday today! 🎉"));
        const people = new Map();
        data.forEach((row) => {
          if (!people.has(row.recipient_id)) {
            people.set(row.recipient_id, {
              name: row.recipient_name,
              message: row.birthday_message || "",
              wishes: [],
            });
          }
          if (row.wish_id) people.get(row.recipient_id).wishes.push(row);
        });
        people.forEach((person, recipientId) => {
          const isBirthdayUser = recipientId === ctx.user.id;
          const card = el("section", "birthday-person bday-person");
          card.append(
            el("h3", "bday-name", "Happy birthday, " + person.name + "!"),
            el("p", "birthday-subtitle", "We hope you have a wonderful day!"),
          );
          card.appendChild(
            PortalisBirthday.createStage({
              recipientId: recipientId,
              name: person.name,
              message: person.message,
              photoPath: photos[recipientId] || null,
              song: (settings[recipientId] || {}).song,
              style: (settings[recipientId] || {}).style,
              isAdmin: !!ctx.isAdmin,
              onNotify: (text, bad) => (bad ? err(text) : ok(text)),
            }),
          );
          const publicMessage = el("div", "birthday-public-message");
          if (person.message) {
            publicMessage.append(
              el("strong", "", person.name + " says:"),
              el("p", "", person.message),
            );
          } else if (!isBirthdayUser) {
            publicMessage.appendChild(
              el("p", "birthday-no-message", "No public birthday message yet."),
            );
          }
          if (person.message || !isBirthdayUser)
            card.appendChild(publicMessage);
          if (isBirthdayUser) {
            const messageForm = el("form", "birthday-message-form");
            const messageInput = el("textarea", "birthday-message-input");
            messageInput.maxLength = 500;
            messageInput.rows = 2;
            messageInput.placeholder =
              "Share a birthday wish or thank-you with everyone...";
            messageInput.setAttribute(
              "aria-label",
              "Your public birthday message",
            );
            messageInput.value = person.message;
            const messageSubmit = el(
              "button",
              "birthday-message-submit",
              person.message ? "Update public message" : "Share with everyone",
            );
            messageSubmit.type = "submit";
            messageForm.append(messageInput, messageSubmit);
            messageForm.onsubmit = async (event) => {
              event.preventDefault();
              const content = messageInput.value.trim();
              if (!content) {
                err("Write a message before sharing it.");
                return;
              }
              messageSubmit.disabled = true;
              const { error: messageError } = await sb.rpc(
                "post_my_birthday_message",
                { p_content: content },
              );
              messageSubmit.disabled = false;
              if (messageError) {
                err(messageError.message);
                return;
              }
              ok("Your birthday message is now visible to everyone.");
              await loadBirthdayGreeting();
            };
            card.appendChild(messageForm);
          }
          if (isBirthdayUser) {
            const wishList = el("div", "birthday-wish-list");
            if (person.wishes.length) {
              person.wishes.forEach((wish) => {
                const note = el("article", "birthday-wish");
                note.append(
                  staffAuthorName(wish.author_name || "Classmate", wishTitles[wish.author_id], wish.author_id),
                  el("p", "", wish.content),
                  el("small", "", fmtDate(wish.created_at)),
                );
                wishList.appendChild(note);
              });
            } else
              wishList.appendChild(
                el(
                  "p",
                  "birthday-no-wishes",
                  "Your birthday wishes will appear here.",
                ),
              );
            card.appendChild(wishList);
          } else {
            card.appendChild(
              el(
                "p",
                "birthday-private-wishes",
                "Birthday wishes are private to the student celebrating today.",
              ),
            );
          }
          if (!isBirthdayUser) {
            const form = el("form", "birthday-wish-form");
            const input = el("textarea", "birthday-wish-input");
            input.maxLength = 500;
            input.rows = 2;
            input.placeholder = "Write a birthday wish...";
            input.setAttribute(
              "aria-label",
              "Birthday wish for " + person.name,
            );
            const submit = el("button", "birthday-wish-submit", "Send wish");
            submit.type = "submit";
            form.append(input, submit);
            form.onsubmit = async (event) => {
              event.preventDefault();
              const content = input.value.trim();
              if (!content) return;
              submit.disabled = true;
              const { error: wishError } = await sb.rpc("post_birthday_wish", {
                p_recipient_id: recipientId,
                p_content: content,
              });
              submit.disabled = false;
              if (wishError) {
                err(wishError.message);
                return;
              }
              ok("Your birthday wish was sent.");
              await loadBirthdayGreeting();
            };
            card.appendChild(form);
          }
          pin.appendChild(card);
        });
        pin.hidden = false;
      }

      function setView(v) {
        view = v;
        filter = "all";
        clearMsg();
        document
          .getElementById("tabBoard")
          .classList.toggle("on", v === "board");
        document.getElementById("tabMine").classList.toggle("on", v === "mine");
        document.getElementById("composer").style.display =
          v === "mine" ? "block" : "none";
        document.getElementById("eventsStrip").classList.toggle("view-off", v !== "board");
        if (v !== "board") {
          document.getElementById("birthdayGreeting").hidden = true;
        }
        loadNotes();
      }
      document.getElementById("tabBoard").onclick = () => setView("board");
      document.getElementById("tabMine").onclick = () => setView("mine");

      async function loadNotes() {
        let q = sb
          .from("notes")
          .select("*")
          .order("created_at", { ascending: false });
        q =
          view === "mine"
            ? q.eq("user_id", ctx.user.id)
            : q.eq("status", "approved");
        const { data, error } = await q;
        if (error) {
          err(error.message);
          return;
        }
        try {
          const titles = await loadStaffAuthorTitles(data.map((note) => note.user_id));
          notes = data.map((note) => ({ ...note, staff_title: titles[note.user_id] }));
        } catch (titleError) {
          err(titleError.message);
          return;
        }
        if (view === "board")
          await loadBirthdayGreeting();
        counts = {};
        const ids = notes
          .filter((n) => n.status === "approved")
          .map((n) => n.id);
        if (ids.length) {
          const { data: cs } = await sb
            .from("comments")
            .select("note_id")
            .in("note_id", ids);
          (cs || []).forEach((c) => {
            counts[c.note_id] = (counts[c.note_id] || 0) + 1;
          });
        }
        render();
      }

      function renderFilters() {
        const box = document.getElementById("filters");
        box.innerHTML = "";
        const all = el(
          "button",
          "fbtn" + (filter === "all" ? " active" : ""),
          "All (" + notes.length + ")",
        );
        all.onclick = () => {
          filter = "all";
          render();
        };
        box.appendChild(all);
        ORDER.forEach((p) => {
          const count = notes.filter((n) => n.priority === p).length;
          const b = el(
            "button",
            "fbtn p-" + p + (filter === p ? " active" : ""),
            LABEL[p] + " (" + count + ")",
          );
          b.onclick = () => {
            filter = p;
            render();
          };
          box.appendChild(b);
        });
      }

      function render() {
        renderFilters();
        const board = document.getElementById("board");
        board.querySelectorAll(".comments[aria-expanded='true']").forEach((panel) => {
          if (panel.closePanel) panel.closePanel();
        });
        board.innerHTML = "";
        const shown = notes
          .filter((n) => filter === "all" || n.priority === filter)
          .sort(
            (a, b) => ORDER.indexOf(a.priority) - ORDER.indexOf(b.priority),
          );
        const empty = document.getElementById("empty");
        empty.style.display = shown.length ? "none" : "block";
        empty.textContent =
          view === "mine"
            ? "You have no notes here yet. Write one above."
            : "No approved notes yet.";
        shown.forEach((n) => {
          board.appendChild(
            noteCard(n, {
              canPrioritize: ctx.isAdmin,
              showStatus: true,
              onPriority: setPriority,
              footer: n.status === "approved" ? commentsFooter(n) : null,
            }),
          );
        });
      }

      async function setPriority(n, p) {
        if (n.priority === p) return;
        const { error } = await sb
          .from("notes")
          .update({ priority: p })
          .eq("id", n.id);
        if (error) {
          err(error.message);
          return;
        }
        n.priority = p;
        render();
      }

      /* ---------- public comments ---------- */
      function commentsFooter(n) {
        return function (card) {
          const wrap = el("div", "comments");
          wrap.setAttribute("aria-expanded", "false");
          const toggle = el(
            "button",
            "ghost small",
            "Comments (" + (counts[n.id] || 0) + ")",
          );
          toggle.type = "button";
          toggle.setAttribute("aria-expanded", "false");
          const body = el("div", "cbody");
          body.style.display = "none";
          const list = el("div", "clist");
          const viewport = el("div", "comment-viewport");
          viewport.appendChild(list);
          const navigation = el("div", "comment-navigation");
          const previous = el("button", "ghost comment-arrow", "\u2190");
          previous.type = "button";
          previous.setAttribute("aria-label", "Previous comment");
          const position = el("span", "comment-position");
          const next = el("button", "ghost comment-arrow", "\u2192");
          next.type = "button";
          next.setAttribute("aria-label", "Next comment");
          navigation.append(previous, position, next);
          navigation.hidden = true;
          const header = el("div", "comments-header");
          const row = el("div", "addsub");
          const inp = el("input", "mini");
          inp.placeholder = "Ask what it's for...";
          inp.maxLength = 500;
          const post = el("button", "plus", "Post");
          post.style.fontSize = "18px";
          let currentComment = 0;
          let rotationTimer = null;

          function stopRotation() {
            if (rotationTimer !== null) {
              window.clearInterval(rotationTimer);
              rotationTimer = null;
            }
          }

          function closePanel() {
            body.style.display = "none";
            toggle.setAttribute("aria-expanded", "false");
            wrap.setAttribute("aria-expanded", "false");
            navigation.hidden = true;
            stopRotation();
          }
          wrap.closePanel = closePanel;

          function showComment(index) {
            const total = list.children.length;
            if (!total) return;
            currentComment = (index + total) % total;
            list.style.transform = "translateX(-" + currentComment * 100 + "%)";
            position.textContent = (currentComment + 1) + " / " + total;
          }

          function startRotation() {
            stopRotation();
            if (list.children.length > 1) {
              rotationTimer = window.setInterval(() => {
                if (!wrap.isConnected || body.style.display === "none") {
                  closePanel();
                  return;
                }
                if (reactionPickerOpen()) return;
                showComment(currentComment + 1);
              }, 10000);
            }
          }

          async function load() {
            stopRotation();
            const { data, error } = await sb
              .from("comments")
              .select("*")
              .eq("note_id", n.id)
              .order("created_at");
            list.innerHTML = "";
            if (error) {
              list.textContent = error.message;
              navigation.hidden = true;
              return;
            }
            let titles;
            try {
              titles = await loadStaffAuthorTitles(data.map((comment) => comment.user_id));
            } catch (titleError) {
              list.textContent = titleError.message;
              navigation.hidden = true;
              return;
            }
            if (body.style.display === "none") return;
            counts[n.id] = data.length;
            toggle.textContent = "Comments (" + data.length + ")";
            currentComment = 0;
            if (!data.length) {
              list.appendChild(el("p", "hint comment-empty", "No comments yet. Ask a question!"));
              navigation.hidden = true;
            }
            const noteReactions = {};
            let noteReactionsOk = false;
            if (data.length) {
              const rr = await sb.rpc("get_note_comment_reactions", { p_comment_ids: data.map((c) => c.id) });
              if (!rr.error) {
                noteReactionsOk = true;
                (rr.data || []).forEach((x) => { (noteReactions[x.comment_id] = noteReactions[x.comment_id] || []).push(x); });
              }
            }
            data.forEach((c) => {
              const slide = el("div", "comment-slide");
              const d = el("div", "comment");
              const h = el("div", "chead");
              h.appendChild(staffAuthorName(c.author_name || "user", titles[c.user_id], c.user_id));
              h.appendChild(el("small", "", fmtDate(c.created_at)));
              if (ctx.isAdmin) {
                const x = el("button", "x", "\u00d7");
                x.title = "Delete comment";
                x.onclick = async () => {
                  if (!confirm("Delete this comment?")) return;
                  const { error } = await sb
                    .from("comments")
                    .delete()
                    .eq("id", c.id);
                  if (error) alert(error.message);
                  else load();
                };
                h.appendChild(x);
              }
              d.appendChild(h);
              d.appendChild(el("div", "ctext", c.content));
              if (noteReactionsOk) {
                d.appendChild(createReactions({
                  table: "comment_reactions", idColumn: "comment_id", targetId: c.id,
                  reactions: noteReactions[c.id] || [], names: false, compact: true,
                  me: { id: ctx.user.id, name: ctx.profile.full_name || "You", nickname: nickCache[ctx.user.id] || "" }
                }));
              }
              slide.appendChild(d);
              list.appendChild(slide);
            });
            navigation.hidden = data.length < 2;
            showComment(0);
            startRotation();
          }
          async function add() {
            const t = inp.value.trim();
            if (!t) return;
            const { error } = await sb
              .from("comments")
              .insert({ note_id: n.id, content: t });
            if (error) {
              alert(error.message);
              return;
            }
            inp.value = "";
            load();
          }
          toggle.onclick = (event) => {
            event.stopPropagation();
            const open = toggle.getAttribute("aria-expanded") !== "true";
            if (open) {
              document
                .querySelectorAll(".comments[aria-expanded='true']")
                .forEach((panel) => {
                  if (panel !== wrap && panel.closePanel) panel.closePanel();
                });
              body.style.display = "block";
              toggle.setAttribute("aria-expanded", "true");
              wrap.setAttribute("aria-expanded", "true");
              load();
            } else {
              closePanel();
            }
          };
          previous.onclick = (event) => {
            event.stopPropagation();
            showComment(currentComment - 1);
            startRotation();
          };
          next.onclick = (event) => {
            event.stopPropagation();
            showComment(currentComment + 1);
            startRotation();
          };
          post.onclick = add;
          inp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") add();
          });
          row.append(inp, post);
          header.append(toggle, navigation);
          body.append(viewport, row);
          wrap.append(header, body);
          card.appendChild(wrap);
        };
      }

      /* ---------- new note form ---------- */
      const HINTS = {
        text: "Write it however you like.",
        bullets: "One item per line. Each line becomes a bullet.",
        numbered: "One item per line. Lines are numbered automatically.",
      };
      function updateHint() {
        document.getElementById("fmtHint").textContent =
          HINTS[document.querySelector('input[name="fmt"]:checked').value];
      }
      document
        .querySelectorAll('input[name="fmt"]')
        .forEach((r) => r.addEventListener("change", updateHint));
      updateHint();

      function renderPending() {
        const ul = document.getElementById("pending");
        ul.innerHTML = "";
        pending.forEach((t, i) => {
          const li = el("li");
          li.appendChild(el("span", "", t));
          const x = el("button", "x", "\u00d7");
          x.onclick = () => {
            pending.splice(i, 1);
            renderPending();
          };
          li.appendChild(x);
          ul.appendChild(li);
        });
      }
      function addPending() {
        const inp = document.getElementById("subInput");
        const t = inp.value.trim();
        if (!t) return;
        pending.push(t);
        inp.value = "";
        renderPending();
        inp.focus();
      }
      document.getElementById("subAdd").onclick = addPending;
      document.getElementById("subInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addPending();
        }
      });

      // The composer paper changes colour with the importance, and the title shows a live counter.
      function syncComposer() {
        const checked = document.querySelector('input[name="prio"]:checked');
        document.getElementById("composer").className = "note composer p-" + (checked ? checked.value : "medium");
        document.getElementById("titleCount").textContent = document.getElementById("title").value.length + "/80";
      }
      document.getElementById("importancePicker").addEventListener("change", syncComposer);
      document.getElementById("title").addEventListener("input", syncComposer);

      document.getElementById("add").onclick = async () => {
        clearMsg();
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        const priority = document.querySelector(
          'input[name="prio"]:checked',
        ).value;
        const format = document.querySelector(
          'input[name="fmt"]:checked',
        ).value;
        const leftover = document.getElementById("subInput").value.trim();
        if (leftover) pending.push(leftover);
        if (!title && !content && !pending.length) {
          err("Write a title, details, or a subnote first.");
          return;
        }

        const { error } = await sb.from("notes").insert({
          title,
          content,
          priority,
          format,
          subnotes: pending.map((t) => ({ text: t, done: false })),
        });
        if (error) {
          err(error.message);
          return;
        }

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
        document.getElementById("subInput").value = "";
        document.querySelector('input[name="prio"][value="medium"]').checked =
          true;
        document.querySelector('input[name="fmt"][value="text"]').checked =
          true;
        updateHint();
        syncComposer();
        pending = [];
        renderPending();
        await loadNotes();
        ok(
          ctx.isAdmin
            ? "Posted."
            : "Sent! An admin or officer will review it before it appears on the public board.",
        );
      };

      syncComposer();
      init();
    </script>
  </body>
</html>
