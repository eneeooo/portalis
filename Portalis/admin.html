<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portalis - Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <div class="wrap">
    <div id="bar"></div>
    <p id="msg" class="msg"></p>

    <h2>Review queue <span id="qcount" class="badge"></span></h2>
    <p class="hint">Notes stay private to their author until you approve them.</p>
    <div id="queue" class="board" style="margin-top:34px"></div>
    <p id="qempty" class="empty" style="display:none">Nothing waiting for review.</p>

    <div class="section">
      <h2>All notes</h2>
      <div id="filters" class="filters" style="margin-top:12px"></div>
      <div id="board" class="board"></div>
    </div>

    <div class="section">
      <h2>Users and roles</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Student number</th><th>Full name</th><th>Email</th><th style="width:160px">Role</th><th>Actions</th></tr></thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2>Suggestions</h2>
      <div id="suggestions"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    let ctx, notes = [], filter = "all";
    const msg = document.getElementById("msg");
    function err(t) { msg.className = "msg err"; msg.textContent = t; }
    function ok(t) { msg.className = "msg ok"; msg.textContent = t; }

    async function init() {
      ctx = await requireAuth(true);
      if (!ctx) return;
      renderBar(ctx, "admin");
      await loadUsers();
      await loadSuggestions();
      await loadNotes();
    }

    async function loadUsers() {
      const { data, error } = await sb.from("profiles").select("id,email,student_number,full_name,role").order("created_at");
      const body = document.getElementById("users");
      body.innerHTML = "";
      if (error) { err(error.message); return; }
      data.forEach(u => {
        const tr = document.createElement("tr");
        const tdRole = document.createElement("td");
        const actionCell = document.createElement("td");
        const actions = el("div", "user-actions");
        const sel = el("select", "role-select");
        sel.setAttribute("aria-label", "Role for " + (u.full_name || u.email || "user"));
        ["user", "officer", "admin"].forEach(r => {
          const roleLabels = { user: "Student", officer: "Officer", admin: "Admin" };
          const o = el("option", "", roleLabels[r]);
          o.value = r;
          if (u.role === r) o.selected = true;
          sel.appendChild(o);
        });
        if (u.id === ctx.user.id) sel.disabled = true; // can't demote yourself
        sel.onchange = async () => {
          const nextRole = sel.value;
          const roleName = role => ({ user: "Student", officer: "Officer", admin: "Admin" })[role] || role;
          if (!confirm("Change " + (u.full_name || u.email || "this account") + "'s role from " + roleName(u.role) + " to " + roleName(nextRole) + "?")) {
            sel.value = u.role;
            return;
          }
          sel.disabled = true;
          const { error } = await sb.from("profiles").update({ role: sel.value }).eq("id", u.id);
          sel.disabled = u.id === ctx.user.id;
          if (error) {
            sel.value = u.role;
            err(error.message);
          } else {
            u.role = nextRole;
            ok("Role updated.");
          }
        };
        const identity = el("button", "ghost small edit-student-button", "Edit student number");
        identity.title = "Set student number for this account";
        identity.onclick = async () => {
          const student_number = prompt("Student number (00-00-000):", u.student_number || "");
          if (student_number === null) return;
          const number = student_number.trim();
          if (!/^\d{2}-\d{2}-\d{3}$/.test(number)) {
            err("Enter a student number in the format 00-00-000."); return;
          }
          if (!confirm("Save student number " + number + " for " + (u.full_name || u.email || "this account") + "?")) return;
          const { error } = await sb.from("profiles").update({ student_number: number }).eq("id", u.id);
          if (error) err(/duplicate|unique/i.test(error.message) ? "That student number is already taken." : error.message);
          else { ok("Student identity updated."); await loadUsers(); }
        };
        actions.appendChild(identity);
        const remove = el("button", "danger small delete-user-button", "Delete user");
        remove.disabled = u.id === ctx.user.id;
        remove.title = remove.disabled ? "You cannot delete the currently signed-in admin account." : "Permanently delete this account and its Portalis data.";
        remove.onclick = async () => {
          if (u.id === ctx.user.id) return;
          const label = [u.full_name, u.student_number, u.email].filter(Boolean).join(" · ") || u.id;
          if (!confirm("Permanently delete " + label + " and all associated Portalis data? This cannot be undone.")) return;
          remove.disabled = true;
          const { data, error } = await sb.functions.invoke("admin-delete-user", { body: { userId: u.id } });
          if (error) {
            let detail = error.message || "Could not delete this user.";
            if (error.context instanceof Response) {
              try {
                const response = await error.context.clone().json();
                if (response.error) detail = response.error;
              } catch {
                detail = error.message || "Could not read the deletion function response.";
              }
            }
            if (/not found|404/i.test(detail)) {
              detail += " Deploy the latest admin-delete-user Edge Function, then reload this page.";
            } else if (error.name === "FunctionsFetchError") {
              detail += " Check that admin-delete-user is deployed in the same Supabase project.";
            }
            err(detail);
            remove.disabled = false;
            return;
          }
          ok(data && data.warning
            ? data.warning
            : "User and associated Portalis data deleted.");
          await Promise.all([loadUsers(), loadSuggestions(), loadNotes()]);
        };
        actions.appendChild(remove);
        actionCell.appendChild(actions);
        tdRole.appendChild(sel);
        const shownEmail = u.email || "Not set";
        tr.append(el("td", "", u.student_number || "—"), el("td", "", u.full_name || "—"), el("td", "", shownEmail), tdRole, actionCell);
        body.appendChild(tr);
      });
    }

    async function loadSuggestions() {
      const box = document.getElementById("suggestions");
      const { data, error } = await sb.from("suggestions").select("id,user_id,content,created_at").order("created_at", { ascending: false });
      if (error) { err(error.message); return; }
      box.innerHTML = "";
      if (!data.length) { box.appendChild(el("p", "empty", "No suggestions yet.")); return; }
      const { data: profiles, error: profileError } = await sb.from("profiles").select("id,full_name,student_number").in("id", data.map(x => x.user_id));
      if (profileError) { err(profileError.message); return; }
      const byId = Object.fromEntries(profiles.map(x => [x.id, x]));
      data.forEach(s => {
        const item = el("div", "suggestion-item");
        const p = byId[s.user_id] || {};
        const header = el("div", "suggestion-header");
        header.append(
          el("b", "suggestion-name", p.full_name || "Student"),
          el("span", "suggestion-student-number", p.student_number || "No student number")
        );
        const content = el("p", "suggestion-content", s.content);
        const footer = el("div", "suggestion-footer");
        footer.appendChild(el("small", "suggestion-date", fmtDate(s.created_at)));
        const remove = el("button", "ghost small", "Delete");
        remove.onclick = async () => {
          if (!confirm("Delete this suggestion?")) return;
          const { error } = await sb.from("suggestions").delete().eq("id", s.id);
          if (error) err(error.message); else loadSuggestions();
        };
        footer.appendChild(remove);
        item.append(header, content, footer);
        box.appendChild(item);
      });
    }

    async function loadNotes() {
      const { data, error } = await sb.from("notes").select("*").order("created_at", { ascending: false });
      if (error) { err(error.message); return; }
      notes = data;
      render();
    }

    async function setStatus(n, status, reason) {
      const { error } = await sb.from("notes").update({ status: status, reject_reason: reason || null }).eq("id", n.id);
      if (error) { err(error.message); return; }
      n.status = status; n.reject_reason = reason || null;
      ok(status === "approved" ? "Approved. It is now on the public board." : "Rejected.");
      render();
    }

    async function setPriority(n, priority) {
      const { error } = await sb.from("notes").update({ priority }).eq("id", n.id);
      if (error) { err(error.message); return; }
      n.priority = priority;
      render();
    }

    function reviewActions(n) {
      const list = [];
      if (n.status !== "approved") {
        const a = el("button", "", "Approve");
        a.onclick = () => setStatus(n, "approved");
        list.push(a);
      }
      if (n.status !== "rejected") {
        const r = el("button", "ghost", n.status === "approved" ? "Unpublish" : "Reject");
        r.onclick = () => {
          const reason = prompt("Reason (optional, the author will see it):", "");
          if (reason === null) return;
          setStatus(n, "rejected", reason.trim());
        };
        list.push(r);
      }
      const d = el("button", "ghost", "Delete");
      d.onclick = async () => {
        if (!confirm("Delete this note permanently?")) return;
        const { error } = await sb.from("notes").delete().eq("id", n.id);
        if (error) err(error.message);
        else { notes = notes.filter(x => x.id !== n.id); render(); }
      };
      list.push(d);
      return list;
    }

    function render() {
      const pend = notes.filter(n => n.status === "pending").sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      document.getElementById("qcount").textContent = pend.length;
      const queue = document.getElementById("queue");
      queue.innerHTML = "";
      document.getElementById("qempty").style.display = pend.length ? "none" : "block";
      pend.forEach(n => queue.appendChild(noteCard(n, { showStatus: true, canPrioritize: true, onPriority: setPriority, actions: reviewActions(n) })));

      const box = document.getElementById("filters");
      box.innerHTML = "";
      [["all", "All"], ["pending", "Pending"], ["approved", "Approved"], ["rejected", "Rejected"]].forEach(f => {
        const count = f[0] === "all" ? notes.length : notes.filter(n => n.status === f[0]).length;
        const b = el("button", "fbtn" + (filter === f[0] ? " active" : ""), f[1] + " (" + count + ")");
        b.onclick = () => { filter = f[0]; render(); };
        box.appendChild(b);
      });
      const board = document.getElementById("board");
      board.innerHTML = "";
      notes
        .filter(n => filter === "all" || n.status === filter)
        .sort((a, b) => ORDER.indexOf(a.priority) - ORDER.indexOf(b.priority))
        .forEach(n => board.appendChild(noteCard(n, { showStatus: true, canPrioritize: true, onPriority: setPriority, actions: reviewActions(n) })));
    }

    init();
  </script>
</body>
</html>
