<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portalis - Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth">
    <h1>Portalis</h1>
    <p class="sub">Your sticky notes, safe and sound.</p>
    <div class="note">
      <h2>Log in</h2>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" autocomplete="current-password">
      <button id="login" class="full">Log in</button>
      <p id="msg" class="msg"></p>
      <p class="switch">No account yet? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const btn = document.getElementById("login");

    sb.auth.getSession().then(({ data }) => {
      if (data.session) location.href = "dashboard.html";
    });

    async function doLogin() {
      msg.className = "msg"; msg.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) { msg.className = "msg err"; msg.textContent = "Enter your email and password."; return; }
      btn.disabled = true;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      if (error) { msg.className = "msg err"; msg.textContent = error.message; }
      else location.href = "dashboard.html";
    }

    btn.onclick = doLogin;
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
