<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portalis - Log in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth">
      <h1>Portalis</h1>
      <p class="sub">Your class space for notes and reviewers.</p>
      <div class="note">
        <button id="signupTape" class="auth-tape" type="button" aria-label="Remove tape to show signup" aria-controls="signupLink" title="Remove tape"></button>
        <h2>Log in</h2>
        <label for="studentNumber">Student number</label>
        <input id="studentNumber" inputmode="numeric" autocomplete="username" placeholder="00-00-000" />
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Your password" autocomplete="current-password" />
        <button id="login" class="full">Log in</button>
        <p id="msg" class="msg"></p>
        <p id="learningQuote" class="learning-quote"></p>
        <a id="signupLink" class="btn full signup-link" href="signup.html" hidden>Sign up</a>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script>
      const msg = document.getElementById("msg");
      const btn = document.getElementById("login");
      const numberInput = document.getElementById("studentNumber");
      const signupTape = document.getElementById("signupTape");
      const signupLink = document.getElementById("signupLink");
      const learningQuotes = [
        "Every lesson learned is a new tool for tomorrow.",
        "Small study steps can lead to remarkable discoveries.",
        "Curiosity turns an ordinary class into an opportunity.",
        "A question asked today can open a door tomorrow.",
        "Practice is how effort becomes confidence.",
        "Learning grows whenever you give an idea your attention.",
        "Each page you read adds another path to explore.",
        "Mistakes are drafts on the way to understanding.",
        "A focused hour can brighten the whole day.",
        "Good ideas often begin with a curious mind.",
        "Your next breakthrough may start with one more try.",
        "Studying is an investment in choices you have not met yet.",
        "New skills begin as small acts of patience.",
        "A classroom is a place where possibilities get practice.",
        "Keep asking why; understanding likes good questions.",
        "Progress is built one solved problem at a time.",
        "Books lend you windows into worlds beyond your own.",
        "Learning makes the familiar interesting and the unknown approachable.",
        "A little preparation gives big ideas room to shine.",
        "The habit of trying is a lesson that lasts.",
        "Share what you know; explaining helps understanding grow.",
        "The hardest chapter can become your proudest one.",
        "Ideas get stronger when you test them with care.",
        "Every class is a chance to notice something new.",
        "Patience helps difficult concepts find their place.",
        "A curious student can find a lesson almost anywhere.",
        "Learning is progress you carry with you.",
        "Give your goals the same attention you give your notes.",
        "Today’s effort is tomorrow’s useful knowledge.",
        "Stay curious, stay kind, and keep learning."
      ];

      function show(text, isErr) { msg.className = "msg" + (isErr ? " err" : ""); msg.textContent = text; }
      const quoteCard = document.getElementById("learningQuote");
      const quoteColors = ["#fff3a0", "#f6b8dc", "#cde8ff", "#cdeec7", "#ffd3ad", "#ddc7ff"];
      quoteCard.textContent = learningQuotes[Math.floor(Math.random() * learningQuotes.length)];
      quoteCard.style.backgroundColor = quoteColors[Math.floor(Math.random() * quoteColors.length)];
      signupTape.onclick = () => {
        signupTape.remove();
        signupLink.hidden = false;
      };

      // Auto-format as 00-00-000 while typing
      numberInput.addEventListener("input", e => {
        const digits = e.target.value.replace(/\D/g, "").slice(0, 7);
        e.target.value = digits.length > 4 ? digits.slice(0, 2) + "-" + digits.slice(2, 4) + "-" + digits.slice(4)
          : digits.length > 2 ? digits.slice(0, 2) + "-" + digits.slice(2) : digits;
      });

      (async () => {
        let reason = null;
        try { reason = sessionStorage.getItem("portalis_logout_reason"); sessionStorage.removeItem("portalis_logout_reason"); } catch (_) {}
        if (reason) show(reason, true);
        const { data, error } = await sb.auth.getSession();
        if (error || !data.session) {
          if (error) { await sb.auth.signOut({ scope: "local" }).catch(() => {}); }
          return;
        }
        // A stored session may belong to a user that was deleted: verify with the server first.
        const { data: u, error: userError } = await sb.auth.getUser();
        if (userError || !u.user) {
          const offline = userError && (userError.name === "AuthRetryableFetchError" || /failed to fetch|network/i.test(userError.message || ""));
          if (offline) { show("Cannot reach Supabase. Check your connection.", true); return; }
          await sb.auth.signOut({ scope: "local" }).catch(() => {});
          if (!reason) show("Your account was removed or your session expired. Please log in again.", true);
          return;
        }
        location.href = "dashboard.html";
      })();

      async function functionError(error) {
        if (error && error.context instanceof Response) {
          try {
            const body = await error.context.clone().json();
            if (body && body.error) return body.error;
          } catch (_) { /* not JSON */ }
        }
        return null;
      }

      async function doLogin() {
        show("", false);
        const student_number = numberInput.value.trim();
        const password = document.getElementById("password").value;
        if (!/^\d{2}-\d{2}-\d{3}$/.test(student_number) || !password) {
          show("Enter your student number in the format 00-00-000 and your password.", true); return;
        }
        btn.disabled = true;
        try {
          const { data, error } = await sb.functions.invoke("username-login", { body: { student_number, password } });
          if (error) {
            const detail = await functionError(error);
            if (detail) throw new Error(detail);
            if (error.name === "FunctionsFetchError" || error.name === "AuthRetryableFetchError") {
              throw new Error("Cannot reach the student-number login service. Check your connection and that the username-login Edge Function is deployed.");
            }
            throw new Error(error.message || "Could not sign in. Check your student number and password.");
          }
          if (!data || !data.access_token || !data.refresh_token) throw new Error("Login did not return a session.");
          const { error: sessionError } = await sb.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          });
          if (sessionError) throw sessionError;
          location.href = "dashboard.html";
        } catch (error) {
          show(error.message || "Could not log in.", true);
        } finally { btn.disabled = false; }
      }
      btn.onclick = doLogin;
      document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    </script>
  </body>
</html>
